[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "data-agent-baseline"
version = "0.1.0"
description = "ReAct-style baseline for the DABench data-agent benchmark"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=3.3.2",
    "duckdb>=1.5.0",
    "huggingface-hub>=0.29.3",
    "json-repair>=0.59.4",
    "loguru>=0.7.3",
    "numpy>=2.2.6",
    "openai>=2.28.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pandasql>=0.7.3",
    "polars>=1.39.0",
    "pyarrow>=23.0.1",
    "pydantic>=2.10.6",
    "pydantic-ai>=1.107.0",
    "pydantic-ai-backend>=0.2.5",
    "pydantic-ai-todo>=0.1.10",
    "pydantic-deep>=0.3.17",
    "pydantic-monty>=0.0.17",
    "pyrefly>=0.60.0",
    "pyyaml>=6.0.2",
    "rich>=13.9.4",
    "summarization-pydantic-ai>=0.0.5",
    "typer>=0.15.2",
    "static-ffmpeg>=3.0",
    "av>=17.0.1",
    "faster-whisper>=1.2.1",
    "pymupdf>=1.27.2.3",
    "xxhash>=3.7.0",
    "opencc>=1.3.1",
    "ctranslate2>=4.7.2",
    "pillow>=12.2.0",
    "pandas-stubs>=3.0.3.260530",
    "json5>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.11.0",
]


[tool.ruff]
line-length = 100
